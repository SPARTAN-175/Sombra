<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<title>PROTOCOLO: SOMBRA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#eaf0f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{touch-action:none}
#app{width:100%;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% -30%,#182131,#05070b 62%)}
header{height:62px;min-height:62px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1d2938;background:#080c13e8;backdrop-filter:blur(10px)}
.logo{display:flex;gap:9px;align-items:center}.mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(145deg,#d6dde6,#5f6e7d);color:#091018;display:grid;place-items:center;font-weight:1000}.logo b{font-size:16px;letter-spacing:.09em}.logo small{display:block;color:#8492a4;font-size:8px;letter-spacing:.12em}
.hud{display:flex;gap:6px}.chip{background:#0c131d;border:1px solid #263548;border-radius:9px;padding:7px 9px;font-size:10px;color:#8d9db0}.chip strong{color:#e9f1fa;font-size:12px}
#stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:7px}
#game{width:min(100%,1200px);height:auto;max-height:calc(100dvh - 158px);aspect-ratio:44/28;border:1px solid #34475d;border-radius:13px;background:#070b10;box-shadow:0 25px 90px #000b;touch-action:none}
#objective{position:absolute;left:18px;top:17px;max-width:250px;padding:8px 10px;background:#090f18dc;border:1px solid #293b51;border-radius:9px;color:#9eacbc;font-size:9px;pointer-events:none}
#objective b{color:#e8eef5}
#squad{height:105px;min-height:105px;display:flex;gap:7px;align-items:center;padding:7px 10px}
.operator{height:91px;flex:1;max-width:210px;min-width:115px;padding:8px;border:1px solid #26384d;border-radius:11px;background:#0b121c;position:relative;text-align:left}
.operator.sel{border-color:#6fd5b9;box-shadow:0 0 20px #4ed1ad18}.operator .num{position:absolute;right:7px;top:6px;color:#6fd5b9;font-weight:900}.operator b{display:block;font-size:12px}.operator span{display:block;color:#7f90a4;font-size:8px;margin:2px 0 7px}.bar{height:5px;border-radius:4px;background:#1b2735;overflow:hidden}.bar i{display:block;height:100%;background:#5fd8ba}.dead .bar i{background:#a33c4c}.dead{opacity:.42}
#commands{height:58px;min-height:58px;display:flex;justify-content:center;gap:6px;padding:5px 8px;border-top:1px solid #172333;background:#070b12}
.cmd{min-width:78px;border:1px solid #26394f;border-radius:9px;background:#0d1622;color:#dce6f0;font-size:9px;font-weight:900}.cmd.active{border-color:#6bd6bc;background:#12352f;color:#bff9e9}.cmd:active{transform:scale(.97)}
#modal{display:none;position:absolute;inset:0;z-index:8;place-items:center;background:#03050adf;backdrop-filter:blur(8px)}
.card{width:min(90%,450px);background:#0b121d;border:1px solid #354a61;border-radius:18px;padding:25px;text-align:center;box-shadow:0 35px 110px #000e}.tag{color:#6bd6bc;font-size:9px;font-weight:900;letter-spacing:.18em}.card h1{margin:6px 0;font-size:27px}.card p{color:#8c9caf;font-size:12px;line-height:1.5}.row{display:flex;gap:7px}.row button{flex:1}.btn{padding:11px;border:1px solid #293d55;border-radius:10px;background:#111c2a;color:#eef5fb;font-weight:900;font-size:10px}.primary{background:#16483f;border-color:#54bda8}.wide{width:100%;margin-top:7px}
@media(max-width:760px){header{height:54px;min-height:54px}.mark{width:31px;height:31px}.logo small{display:none}.chip{padding:6px 7px}#stage{padding:4px}#game{max-height:calc(100dvh - 155px)}#squad{height:83px;min-height:83px;padding:5px 7px}.operator{height:72px;padding:6px;min-width:82px}.operator span{font-size:7px;margin-bottom:4px}.operator b{font-size:10px}.operator .num{font-size:9px}.bar{height:4px}#commands{height:55px;min-height:55px}.cmd{min-width:65px;font-size:8px}#objective{top:9px;left:9px}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="logo"><div class="mark">S</div><div><b>PROTOCOLO: SOMBRA</b><small>TACTICAL OPERATIONS UNIT</small></div></div>
 <div class="hud"><div class="chip">MISIÓN <strong id="mission">001</strong>/200</div><div class="chip">ESTADO <strong id="state">INICIO</strong></div></div>
</header>
<main id="stage">
 <canvas id="game" width="1056" height="672"></canvas>
 <div id="objective"></div>
 <div id="modal"><div class="card"><div class="tag">INFORME DE OPERACIÓN</div><h1 id="resultTitle"></h1><p id="resultText"></p><div class="row"><button class="btn" id="retry">REINTENTAR</button><button class="btn primary" id="next">SIGUIENTE →</button></div><button class="btn wide" id="full">PANTALLA COMPLETA</button></div></div>
</main>
<section id="squad"></section>
<nav id="commands">
 <button class="cmd active" data-mode="move">MOVER</button><button class="cmd" data-mode="attack">ATACAR</button><button class="cmd" data-mode="cover">CUBRIR</button><button class="cmd" data-mode="hold">ESPERAR</button><button class="cmd" data-mode="stealth">SIGILO</button><button class="cmd" id="execute">EJECUTAR</button>
</nav>
</div>
<script src="game.js"></script>
</body></html>
