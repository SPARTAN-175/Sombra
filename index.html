<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070b0d">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon-192.png">
<title>PROTOCOLO: SOMBRA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b0d;color:#eaf0f0;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{touch-action:none}
#app{width:100%;height:100dvh;display:flex;flex-direction:column;background:#070b0d}
header{height:50px;min-height:50px;display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:#080d11eF;border-bottom:1px solid #28332f;z-index:4}
.brand{display:flex;align-items:center;gap:8px}.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,#e4e9e8,#6e7a78);color:#07100f;display:grid;place-items:center;font-weight:1000}.brand b{font-size:13px;letter-spacing:.08em}.brand small{display:block;font-size:6px;color:#7e8d88}
.hud{display:flex;gap:5px}.chip{padding:5px 7px;border:1px solid #2b3936;border-radius:8px;background:#0b1114;color:#91a19c;font-size:8px}.chip b{color:#edf4f2}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#172019;display:flex;align-items:center;justify-content:center}
#game{display:block;width:100%;height:100%;image-rendering:auto}
#mission{position:absolute;top:9px;left:9px;padding:6px 8px;background:#08100dcc;border:1px solid #33443e;border-radius:7px;color:#a8b6b1;font-size:7px;pointer-events:none;z-index:2}
#status{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:6px 9px;background:#08100dcc;border:1px solid #33443e;border-radius:7px;color:#d6e0dc;font-size:8px;pointer-events:none;z-index:2;white-space:nowrap}
#leftJoy{position:absolute;left:18px;bottom:20px;width:104px;height:104px;border-radius:50%;border:1px solid #66716e;background:#111a1ddd;box-shadow:0 8px 25px #0008;touch-action:none;z-index:5}
#leftKnob{position:absolute;left:31px;top:31px;width:42px;height:42px;border-radius:50%;background:#dce5e2;box-shadow:0 0 15px #fff3}
#rightPad{position:absolute;right:18px;bottom:20px;width:104px;height:104px;border-radius:50%;border:1px solid #66716e;background:#111a1ddd;box-shadow:0 8px 25px #0008;touch-action:none;z-index:5}
#rightKnob{position:absolute;left:31px;top:31px;width:42px;height:42px;border-radius:50%;background:#b7d6c9;box-shadow:0 0 15px #9fe6ce33}
.rbuttons{position:absolute;right:18px;bottom:137px;display:flex;gap:7px;z-index:6}
.action{width:58px;height:42px;border-radius:12px;border:1px solid #52615d;background:#0b1216eF;color:#edf5f2;font-weight:1000;font-size:8px;box-shadow:0 6px 18px #0008}
.action.fire{width:72px;height:72px;border-radius:50%;border-color:#9b6b5c;background:#321b18eF;color:#ffd9cf;font-size:11px}
.weaponbar{position:absolute;right:18px;bottom:248px;display:flex;gap:5px;z-index:6}
.weapon{min-width:58px;height:32px;border-radius:9px;border:1px solid #52615d;background:#0b1216eF;color:#aab7b3;font-size:7px;font-weight:900}.weapon.sel{border-color:#6fd2b5;color:#d8fff2;background:#12332beF}
#squad{position:absolute;left:9px;bottom:10px;display:flex;gap:4px;z-index:3}
.cardop{padding:4px 6px;border:1px solid #30403b;border-radius:7px;background:#09100fe8;color:#dce5e2;font-size:7px;min-width:55px}.cardop.sel{border-color:#6fd2b5}.cardop b{display:block;font-size:8px}.bar{height:3px;background:#26312e;margin-top:3px;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:#64c9aa}
#modal{display:none;position:absolute;inset:0;z-index:10;place-items:center;background:#020506dd;backdrop-filter:blur(6px)}
.modalcard{width:min(88%,430px);padding:24px;border:1px solid #3c4c48;border-radius:18px;background:#0b1216;text-align:center}.modalcard h1{margin:6px 0}.modalcard p{color:#93a39f;font-size:11px}.row{display:flex;gap:6px}.btn{flex:1;padding:11px;border-radius:9px;border:1px solid #40504b;background:#10191d;color:#e9f0ee;font-weight:900;font-size:9px}.primary{border-color:#59b99d;background:#153d33}
@media(max-width:760px){.brand small{display:none}.brand b{font-size:11px}.chip{padding:5px}.rbuttons{bottom:130px}.weaponbar{bottom:218px}.action.fire{width:66px;height:66px}.action{width:54px;height:39px}.leftJoy,#rightPad{width:96px;height:96px}.leftKnob,#rightKnob{left:28px;top:28px}}
</style></head>
<body><div id="app">
<header><div class="brand"><div class="mark">S</div><div><b>PROTOCOLO: SOMBRA</b><small>TOP-DOWN TACTICAL OPERATIONS</small></div></div>
<div class="hud"><div class="chip">MISIÓN <b id="mn">001</b>/200</div><div class="chip">❤️ <b id="hp">100</b></div><div class="chip">🎒 <b id="ammo">30</b></div></div></header>
<main id="stage"><canvas id="game" width="1152" height="768"></canvas>
<div id="mission"></div><div id="status">LISTO</div>
<div id="leftJoy"><div id="leftKnob"></div></div><div id="rightPad"><div id="rightKnob"></div></div>
<div class="weaponbar"><button class="weapon sel" data-w="rifle">RIFLE<br>30</button><button class="weapon" data-w="smg">SMG<br>45</button><button class="weapon" data-w="shotgun">ESCOPETA<br>8</button></div>
<div class="rbuttons"><button class="action" id="grenade">💣<br>GRANADA</button><button class="action fire" id="fire">FUEGO</button><button class="action" id="medic">✚<br>MÉDICO</button></div>
<div id="squad"></div>
<div id="modal"><div class="modalcard"><b style="color:#6fd2b5">INFORME DE OPERACIÓN</b><h1 id="mt">MISIÓN CUMPLIDA</h1><p id="mm"></p><div class="row"><button class="btn" id="retry">REINTENTAR</button><button class="btn primary" id="next">SIGUIENTE →</button></div></div></div>
</main></div><script src="game.js"></script></body></html>
